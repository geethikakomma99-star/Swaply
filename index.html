<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swaply - C2C Exchange App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: #f7f7f7;
            color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .phone-container {
            width: 100%;
            max-width: 412px;
            height: 844px;
            background: #ffffff;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            border: 8px solid #111;
        }
        header {
            padding: 16px 20px;
            background: #fff;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-bottom: 1px solid #eee;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .search-bar {
            background: #f1f1f3;
            padding: 10px 14px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #666;
        }
        .search-bar input {
            border: none;
            background: transparent;
            outline: none;
            width: 100%;
            font-size: 14px;
        }
        .categories {
            display: flex;
            gap: 8px;
            padding: 12px 20px;
            overflow-x: auto;
            background: #fff;
            white-space: nowrap;
            scrollbar-width: none;
        }
        .categories::-webkit-scrollbar { display: none; }
        .cat-chip {
            padding: 6px 14px;
            background: #f1f1f3;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }
        .cat-chip.active {
            background: #111;
            color: #fff;
        }
        .feed {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .product-card {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }
        .product-card:hover {
            transform: translateY(-2px);
        }
        .img-container {
            width: 100%;
            height: 120px;
            background: #e9e9eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #888;
            position: relative;
        }
        .badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            font-size: 10px;
            padding: 3px 6px;
            border-radius: 6px;
        }
        .product-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }
        .product-title {
            font-size: 13px;
            font-weight: 600;
            color: #111;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .price-row {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .resale-price {
            font-size: 14px;
            font-weight: 700;
            color: #111;
        }
        .orig-price {
            font-size: 11px;
            color: #88;
            text-decoration: line-through;
        }
        .nav-bar {
            height: 64px;
            background: #fff;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: #666;
            cursor: pointer;
        }
        .nav-item.active {
            color: #111;
            font-weight: 600;
        }
        /* Modal Overlay */
        .modal {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 75%;
            background: #fff;
            border-radius: 24px 24px 0 0;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.15);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transform: translateY(100%);
            transition: transform 0.3s ease-in-out;
            z-index: 10;
        }
        .modal.open {
            transform: translateY(0);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .close-btn {
            background: #f1f1f3;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-weight: 600;
            cursor: pointer;
        }
        .action-btn {
            background: #111;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            margin-top: auto;
        }
    </style>
</head>
<body>

<div class="phone-container">
    <!-- Header -->
    <header>
        <div class="header-top">
            <h1>Swaply</h1>
            <span style="font-size: 13px; font-weight: 500; color: #555;">📍 Ongole</span>
        </div>
        <div class="search-bar">
            <span>🔍</span>
            <input type="text" id="searchInput" placeholder="Search phones, bikes, books..." onkeyup="filterProducts()">
        </div>
    </header>

    <!-- Categories -->
    <div class="categories">
        <div class="cat-chip active" onclick="filterCategory('All', this)">All Items</div>
        <div class="cat-chip" onclick="filterCategory('Electronics', this)">Electronics</div>
        <div class="cat-chip" onclick="filterCategory('Vehicles', this)">Vehicles</div>
        <div class="cat-chip" onclick="filterCategory('Books', this)">Books</div>
        <div class="cat-chip" onclick="filterCategory('Home', this)">Home</div>
    </div>

    <!-- Product Feed -->
    <div class="feed" id="productFeed"></div>

    <!-- Bottom Navigation -->
    <div class="nav-bar">
        <div class="nav-item active">🏠<span>Home</span></div>
        <div class="nav-item">💬<span>Alerts</span></div>
        <div class="nav-item">➕<span>Sell</span></div>
        <div class="nav-item">👤<span>Profile</span></div>
    </div>

    <!-- Product Detail Modal -->
    <div class="modal" id="productModal">
        <div class="modal-header">
            <h2 id="modalTitle" style="font-size: 18px;">Product Title</h2>
            <button class="close-btn" onclick="closeModal()">✕</button>
        </div>
        <div style="font-size: 13px; color: #666;" id="modalCategory">Category</div>
        <div style="font-size: 20px; font-weight: 700;" id="modalPrice">₹0</div>
        <p id="modalDesc" style="font-size: 14px; color: #444; line-height: 1.5;"></p>
        <div style="background: #f9f9fb; padding: 12px; border-radius: 10px; font-size: 13px;">
            🛡️ <b>Swaply Verified:</b> Inspected for condition and verified local seller.
        </div>
        <button class="action-btn" onclick="alert('Offer sent to seller!')">Make an Offer / Chat</button>
    </div>
</div>

<script>
    const products = [
        { id: 1, name: "Nothing Phone 2a", category: "Electronics", resale: "₹13,000", orig: "₹23,999", desc: "A transparent-backed mid-range smartphone featuring a unique rear Glyph interface and bright AMOLED display." },
        { id: 2, name: "Pink Jupiter Scooty", category: "Vehicles", resale: "₹52,000", orig: "₹92,000", desc: "A lightweight, easy-handling automatic scooter in a vibrant glossy pink finish tailored for everyday urban commuting." },
        { id: 3, name: "Bullet Bike", category: "Vehicles", resale: "₹1,10,000", orig: "₹1,95,000", desc: "A retro-styled heavy cruiser motorcycle known for its signature deep exhaust thump and timeless metal chassis." },
        { id: 4, name: "Sofa Set", category: "Home", resale: "₹8,500", orig: "₹24,000", desc: "A comfortable three-piece upholstered living room seating arrangement built with high-density foam cushions." },
        { id: 5, name: "NCERT Chemistry Fingertips", category: "Books", resale: "₹250", orig: "₹699", desc: "A comprehensive objective question bank book structured line-by-line for mastering senior secondary chemistry competitive exams." },
        { id: 6, name: "Rubber Hex Dumbbell", category: "Home", resale: "₹800", orig: "₹1,800", desc: "A rubber-coated hexagonal hand weight designed with an ergonomic steel grip handle for strength training workouts." }
    ];

    function renderProducts(items) {
        const feed = document.getElementById('productFeed');
        feed.innerHTML = '';
        items.forEach(p => {
            feed.innerHTML += `
                <div class="product-card" onclick="openModal('${p.name}', '${p.category}', '${p.resale}', '${p.desc}')">
                    <div class="img-container">
                        <span class="badge">${p.category}</span>
                        📦 Preview
                    </div>
                    <div class="product-info">
                        <div class="product-title">${p.name}</div>
                        <div class="price-row">
                            <span class="resale-price">${p.resale}</span>
                            <span class="orig-price">${p.orig}</span>
                        </div>
                    </div>
                </div>
            `;
        });
    }

    function filterCategory(cat, element) {
        document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
        element.classList.add('active');
        if(cat === 'All') {
            renderProducts(products);
        } else {
            renderProducts(products.filter(p => p.category === cat));
        }
    }

    function filterProducts() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = products.filter(p => p.name.toLowerCase().includes(query) || p.category.toLowerCase().includes(query));
        renderProducts(filtered);
    }

    function openModal(title, category, price, desc) {
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalCategory').innerText = "Category: " + category;
        document.getElementById('modalPrice').innerText = "Resale Price: " + price;
        document.getElementById('modalDesc').innerText = desc;
        document.getElementById('productModal').classList.add('open');
    }

    function closeModal() {
        document.getElementById('productModal').classList.remove('open');
    }

    // Initial render
    renderProducts(products);
</script>

</body>
</html>
